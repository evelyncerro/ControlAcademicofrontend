<div class="h-screen flex bg-slate-100 overflow-hidden">
  <!-- MENU LATERAL -->
  <aside class="w-60 bg-white shadow-lg flex flex-col h-full">
    <!-- Header del menú -->
    <div class="p-4 border-b border-slate-100">
      <h2 class="text-lg font-bold text-slate-800">
        Menu
      </h2>
    </div>

    <!-- Opciones de navegación -->
    <nav class="p-4 text-sm space-y-2 overflow-y-auto">
      <a
        routerLink="/inicio"
        routerLinkActive="font-semibold text-sky-600"
        class="block hover:text-sky-600"
      >
        Inicio
      </a>
      <a
        routerLink="/usuarios"
        routerLinkActive="font-semibold text-sky-600"
        class="block hover:text-sky-600"
      >
        Usuarios
      </a>
      <a
        routerLink="/asignaturas"
        routerLinkActive="font-semibold text-sky-600"
        class="block hover:text-sky-600"
      >
        Asignaturas
      </a>
      <a
        routerLink="/horarios"
        routerLinkActive="font-semibold text-sky-600"
        class="block hover:text-sky-600"
      >
        Horarios
      </a>
    </nav>

    <!-- Cerrar sesión SIEMPRE abajo -->
    <div class="mt-auto p-4 border-t border-slate-100">
      <button
        class="w-full text-sm text-red-600 hover:text-red-700"
        (click)="logout()"
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 h-full overflow-hidden p-6">
    <router-outlet></router-outlet>
  </main>
</div>
