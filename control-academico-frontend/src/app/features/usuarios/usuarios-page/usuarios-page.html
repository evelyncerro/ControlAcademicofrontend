<div class="h-full flex flex-col overflow-hidden">
  <!-- Encabezado -->
  <div class="mb-4 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-slate-800">
        Usuarios
      </h1>
      <p class="text-sm text-slate-500">
        Gestión de usuarios del sistema.
      </p>
    </div>

    <button
      type="button"
      (click)="abrirNuevo()"
      class="h-10 px-5 rounded-full bg-sky-600 text-white text-sm font-medium
            shadow-md hover:bg-sky-700 hover:shadow-lg transition-all"
    >
      Nuevo usuario
    </button>

  </div>

  <div class="flex-1 overflow-auto">
    <div class="bg-white rounded-2xl shadow border border-slate-100">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-50">
          <tr class="text-left text-xs font-semibold text-slate-500 uppercase">
            <th class="px-4 py-3 w-16">ID</th>
            <th class="px-4 py-3">Nombre</th>
            <th class="px-4 py-3">Correo</th>
            <th class="px-4 py-3 w-40">Rol</th>
            <th class="px-4 py-3 w-32 text-center">Acciones</th>
          </tr>
        </thead>

        <tbody>
          @for (usuario of usuarios; track usuario.id) {
            <tr class="border-t border-slate-100 hover:bg-slate-50/70">
              <td class="px-4 py-2 text-slate-600">
                {{ usuario.id }}
              </td>
              <td class="px-4 py-2 text-slate-800">
                {{ usuario.nombre }}
              </td>
              <td class="px-4 py-2 text-slate-700">
                {{ usuario.correo }}
              </td>
              <td class="px-4 py-2">
                <span
                  class="inline-flex px-2.5 py-1 rounded-full text-xs font-medium
                         bg-sky-50 text-sky-700 border border-sky-100 capitalize"
                >
                  {{ usuario.rol }}
                </span>
              </td>
              <td class="px-4 py-2 text-center">
                <button
                  pButton
                  type="button"
                  icon="pi pi-pencil"
                  class="p-button-text p-button-sm mr-1"
                  (click)="editar(usuario)"
                ></button>
                <button
                  pButton
                  type="button"
                  icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger"
                  (click)="confirmarEliminar(usuario)"
                ></button>
              </td>
            </tr>
          }

          @if (usuarios.length === 0) {
            <tr>
              <td
                colspan="5"
                class="px-4 py-6 text-center text-slate-400 text-sm"
              >
                No hay usuarios registrados.
              </td>
            </tr>
          }
        </tbody>
      </table>

      <app-usuario-form-modal
        [visible]="modalVisible"
        [titulo]="usuarioEditando ? 'Editar usuario' : 'Nuevo usuario'"
        [usuario]="usuarioEditando"
        (save)="onGuardarDesdeModal($event)"
        (cancel)="cerrarModal()"
      ></app-usuario-form-modal>


    </div>
  </div>

</div>
